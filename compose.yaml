services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sahay-data:/data
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
volumes:
  sahay-data:
